name: SpMMOTrader
author: DetraisMC
description: Easily created gui for buy mmoitems item using money
version: 1.0.0
main: me.detraismc.spmmotrader.SpMMOTrader
api-version: 1.21
softdepend: [MMOItems, Vault]

commands:
  openmmotrader:
    description: Open a MMOTrader module
    aliases: [mmotrader]
    permission: mmotrader.admin
  mmotraderreload:
    description: Reload all MMOTrader configurations
    permission: mmotrader.admin

permissions:
  mmotrader.admin:
    description: Allows using all MMOTrader commands
    default: op
